<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre avis – La Gourmandine</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F0B92A">
    <link rel="icon" href="../favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <style>
        @font-face { font-family: 'Zilla Slab'; src: url('../fonts/zilla-slab-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Hanken Grotesk'; src: url('../fonts/hanken-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Hanken Grotesk'; src: url('../fonts/hanken-grotesk-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
        :root { --jaune: #F0B92A; --ardoise: #272D33; --texte: #2F2A1A; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hanken Grotesk', system-ui, sans-serif; color: var(--texte); background: var(--jaune); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; -webkit-tap-highlight-color: transparent; }
        main { width: 100%; max-width: 420px; }
        h1 { font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; font-size: clamp(2.6rem, 11vw, 3.4rem); line-height: 1; letter-spacing: -0.02em; }
        .sous { margin: 10px 0 28px; font-size: 1rem; }
        .question { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; }
        .btn { display: block; text-decoration: none; padding: 16px 18px; border-radius: 2px; font-weight: 600; font-size: 1.05rem; margin-top: 12px; }
        .btn small { display: block; font-weight: 400; font-size: 0.82rem; margin-top: 2px; }
        .btn-avis { background: var(--ardoise); color: var(--jaune); }
        .btn-avis .etoiles { display: block; letter-spacing: 3px; font-size: 1.1rem; }
        .btn-site { border: 2px solid var(--ardoise); color: var(--ardoise); }
        .btn:active { transform: scale(0.985); }
        .retour { display: inline-block; margin-top: 22px; font-size: 0.9rem; color: var(--texte); font-weight: 600; }
        .merci { margin-top: 12px; font-size: 0.85rem; }
        :focus-visible { outline: 3px solid var(--ardoise); outline-offset: 3px; }
        ::selection { background: var(--ardoise); color: var(--jaune); }
    </style>
</head>
<body>
    <main>
        <h1>La Gourmandine</h1>
        <p class="sous" id="sous">Boutique de produits normands, Honfleur</p>

        <p class="question" id="question">Un bon moment chez nous&nbsp;?</p>

        <a class="btn btn-avis" href="https://search.google.com/local/writereview?placeid=ChIJFf20YLkz4EcR2WouvIdXE_g" rel="noopener">
            <span class="etoiles" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
            <span id="t-avis">Laisser un avis Google</span>
            <small id="s-avis">Cela ne prend que deux minutes</small>
        </a>

        <a class="btn btn-site" href="../">
            <span id="t-site">Voir le site</span>
            <small id="s-site">Dégustations et produits de la boutique</small>
        </a>

        <a class="retour" href="https://lenclos-honfleur.fr/avis/" id="retour">&larr; Changer d'adresse</a>
        <p class="merci" id="merci">Merci, votre avis compte beaucoup pour nous.</p>
    </main>

    <script>
        var T = {
            fr: { sous: "Boutique de produits normands, Honfleur", question: "Un bon moment chez nous ?", avis: "Laisser un avis Google", savis: "Cela ne prend que deux minutes", site: "Voir le site", ssite: "Dégustations et produits de la boutique", retour: "← Changer d'adresse", merci: "Merci, votre avis compte beaucoup pour nous." },
            en: { sous: "Shop of Norman products, Honfleur", question: "Enjoyed your visit?", avis: "Leave a Google review", savis: "It only takes two minutes", site: "Visit our website", ssite: "Tastings and products of the shop", retour: "← Choose another place", merci: "Thank you, your feedback means a lot to us." },
            nl: { sous: "Winkel met Normandische producten, Honfleur", question: "Een fijne tijd gehad?", avis: "Laat een Google-review achter", savis: "Het duurt maar twee minuten", site: "Naar de website", ssite: "Proeverijen en producten van de winkel", retour: "← Ander adres kiezen", merci: "Dank u, uw mening is erg belangrijk voor ons." }
        };
        var lang = (navigator.language || "fr").slice(0, 2);
        var t = T[lang] || T.fr;
        document.documentElement.lang = T[lang] ? lang : "fr";
        ["sous", "question", "t-avis", "s-avis", "t-site", "s-site", "retour", "merci"].forEach(function (id) {
            var k = { "t-avis": "avis", "s-avis": "savis", "t-site": "site", "s-site": "ssite" }[id] || id;
            document.getElementById(id).textContent = t[k];
        });
    </script>
</body>
</html>
